# Backend monolito (astronautas, Garmin, notificaciones e informes) — puerto 8080
# Construye la imagen DESDE EL CÓDIGO (Maven dentro de Docker). Útil en tu PC.
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# En el EC2 el despliegue lo hace GitHub Actions con deploy/ (ver deploy/README.md).
#
# Requiere .env en esta carpeta (ver .env.example):
#   MySQL    -> DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   DynamoDB -> AWS_REGION, DYNAMODB_TABLE, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   (sin AWS: los informes se guardan en ./data/reports y la app lo avisa)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: astronaut-backend:latest
    container_name: astronaut-backend
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
