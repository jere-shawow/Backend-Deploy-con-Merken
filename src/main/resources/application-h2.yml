# Perfil local sin conexión a MySQL:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/astronautdb
    username: sa
    password:
  sql:
    init:
      platform: h2
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

app:
  seed:
    enabled: true
