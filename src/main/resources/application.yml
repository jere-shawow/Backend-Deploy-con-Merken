server:
  port: ${SERVER_PORT:8080}

# Ground station only. Disabled until a server-only token is provisioned.
analysis:
  bedrock:
    enabled: ${BEDROCK_ANALYSIS_ENABLED:false}
    region: ${BEDROCK_REGION:us-east-1}
    model-id: ${BEDROCK_MODEL_ID:us.amazon.nova-pro-v1:0}
    api-token: ${BEDROCK_ANALYSIS_API_TOKEN:}

# Frontends web en otro dominio (front en la nube). Lista separada por comas.
# Por defecto cualquier origen; en producción conviene poner solo la URL del front.
app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

spring:
  application:
    name: astronaut-backend
  # "mood": "bueno" o "Bueno" se aceptan igual que "BUENO"
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  # Credenciales fuera del código: se leen de variables de entorno o del archivo
  # backend/.env (no se sube a git). Ver backend/.env.example
  config:
    import: optional:file:.env[.properties]
  datasource:
    # MySQL en EC2. El driver se detecta solo a partir de la URL.
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:merken_db}?serverTimezone=UTC&characterEncoding=UTF-8&sslMode=PREFERRED&allowPublicKeyRetrieval=true}"
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  sql:
    init:
      # Scripts por motor: schema-h2.sql (migraciones de la base H2 local / pruebas).
      # En MySQL Hibernate crea las tablas completas, no hay script.
      platform: ${DB_PLATFORM:mysql}
      mode: always
      continue-on-error: false
  jpa:
    hibernate:
      # update: crea/actualiza SOLO las tablas de esta app (astronauts, garmin_links, app_settings,
      # notifications, notification_alert_states);
      # nunca borra tablas ni columnas existentes.
      ddl-auto: update
    open-in-view: false
    show-sql: false
  # Garmin, monitor de notificaciones e informes corren en paralelo
  task:
    scheduling:
      pool:
        size: 4
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Garmin Connect Personal API (sincronización interna de HeartRate y SleepHours)
garmin:
  base-url: ${GARMIN_BASE_URL:https://personal.connectapi.garmin.com}
  # Zona horaria de la cuenta Garmin: define qué día es "hoy" al pedir los datos
  time-zone: ${GARMIN_TIME_ZONE:America/Santiago}
  # El sueño cambia una vez al día: se consulta cada N minutos (el pulso, en cada vuelta)
  sleep-refresh-minutes: ${GARMIN_SLEEP_REFRESH_MINUTES:10}
  # Body Battery cambia durante el día: como máximo 1 consulta cada N segundos
  body-battery-refresh-seconds: ${GARMIN_BODY_BATTERY_REFRESH_SECONDS:60}
  sync:
    # Tarea programada de sincronización (se apaga en las pruebas)
    enabled: ${GARMIN_SYNC_ENABLED:true}

# ---------------------------------------------------------------------------
# Notificaciones de salud (tablas en MySQL)
# ---------------------------------------------------------------------------
notifications:
  # Cada cuántos segundos se revisan los niveles (las alertas salen "apenas" se detectan)
  poll-seconds: ${NOTIFICATIONS_POLL_SECONDS:10}
  # Zona horaria de la hora que aparece en el cuerpo de las notificaciones
  time-zone: ${NOTIFICATIONS_TIME_ZONE:America/Santiago}
  # Vigencia de cada notificación
  timeout-hours: ${NOTIFICATIONS_TIMEOUT_HOURS:24}
  # URGENTE (muy bajo / muy alto): repetición mientras siga en ese nivel
  # (todos los parámetros de salud de health-ranges.json excepto ánimo y nutrición)
  repeat-minutes:
    pulse: 15
    glucose: 30
    temperature: 30
    sleep: 1440   # 1 vez al día
    blood_pressure: 30
    oxygen: 15
    body_battery: 60
    hrv: 1440     # se mide 1 vez por noche
    radiation: 60
  # ADVERTENCIA (bajo / alto): repetición mientras siga en ese nivel
  warning-repeat-minutes:
    pulse: 30
    glucose: 60
    temperature: 60
    sleep: 1440
    blood_pressure: 60
    oxygen: 30
    body_battery: 120
    hrv: 1440
    radiation: 120
  monitor:
    enabled: ${NOTIFICATIONS_MONITOR_ENABLED:true}
  # Recomendación IA (Amazon Nova Pro) al abrir una notificación automática:
  # GET /api/notifications/{id}/recommendation. No se guarda en la base (solo en memoria).
  # true = el envío de los datos del astronauta a AWS Bedrock queda autorizado para toda la
  # tripulación. Requiere además BEDROCK_ANALYSIS_ENABLED=true (ver docs/bedrock-analysis.md).
  ai:
    enabled: ${NOTIFICATIONS_AI_ENABLED:true}
    # Una llamada a Nova por astronauta por alerta nueva o cambio de nivel; se reutiliza hasta 24 h
    cache-hours: ${NOTIFICATIONS_AI_CACHE_HOURS:24}

# ---------------------------------------------------------------------------
# Informes diarios: base NO relacional AWS DynamoDB (respaldo local si no hay conexión)
# ---------------------------------------------------------------------------
reports:
  time-zone: ${REPORTS_TIME_ZONE:America/Santiago}
  # Cada cuántos minutos se agregan los datos al informe del día
  snapshot-interval-minutes: ${REPORTS_SNAPSHOT_MINUTES:10}
  # Retención si no se puede leer la configuración (la real: reportRetentionDays en /api/settings)
  default-retention-days: 7
  # Respaldo local (archivos JSON) cuando DynamoDB no está disponible
  local-dir: ${REPORTS_LOCAL_DIR:./data/reports}
  # Cada cuántos segundos se reintenta conectar a DynamoDB estando en modo local
  storage-check-seconds: ${REPORTS_STORAGE_CHECK_SECONDS:60}
  scheduler:
    enabled: ${REPORTS_SCHEDULER_ENABLED:true}
  # Salida de los informes:
  #   dynamodb -> AWS DynamoDB; si no hay conexión guarda en local y avisa (por defecto)
  #   local    -> solo archivos JSON en local-dir (sin AWS)
  storage: ${REPORTS_STORAGE:dynamodb}
  dynamodb:
    table: ${DYNAMODB_TABLE:astronaut-reports}
    region: ${AWS_REGION:us-east-1}
    # Vacío = DynamoDB de AWS. Para DynamoDB Local: http://localhost:8000
    endpoint: ${DYNAMODB_ENDPOINT:}
    # Vacíos = cadena de credenciales de AWS (variables, ~/.aws o el ROL IAM del EC2)
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    # Crear la tabla si no existe (requiere dynamodb:CreateTable)
    create-table: ${DYNAMODB_CREATE_TABLE:true}

# Datos de ejemplo al arrancar con la base vacía.
# Apagado por defecto: en MySQL se usan los datos reales (se activa en el perfil h2 y en E2E).
logging:
  level:
    com.astronaut: INFO
