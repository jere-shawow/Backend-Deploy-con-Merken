# Perfil "test": base en memoria, sin datos de ejemplo y sin la tarea programada
spring:
  datasource:
    url: jdbc:h2:mem:astronaut-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      platform: h2
  h2:
    console:
      enabled: false

app:
  seed:
    enabled: false

garmin:
  # Las pruebas que usan Garmin apuntan base-url a un servidor falso (@DynamicPropertySource)
  base-url: http://127.0.0.1:9
  time-zone: America/Santiago
  sync:
    enabled: false

notifications:
  monitor:
    enabled: false

reports:
  scheduler:
    enabled: false
  # sin AWS en las pruebas: endpoint inalcanzable -> modo local
  storage-check-seconds: 3600
  local-dir: ${java.io.tmpdir}/astronaut-reports-test
  dynamodb:
    endpoint: http://127.0.0.1:9
    access-key-id: test
    secret-access-key: test
    create-table: false

logging:
  level:
    com.astronaut: WARN
