name: Merken backend CI/CD to clawbot via SSH
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests with H2 and fake Garmin
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Test restricted deployment gate
        run: python3 -m unittest discover -s deploy -p "test_clawbot_deploy.py"
      - name: Build AMD64 image
        run: docker build -t astronaut-backend:${{ github.sha }} .
      - name: Smoke test with isolated in-memory database
        run: |
          docker run -d --name merken-ci -p 127.0.0.1:8080:8080 \
            -e 'DB_URL=jdbc:h2:mem:ci;DB_CLOSE_DELAY=-1' -e DB_USER=sa \
            -e DB_PLATFORM=h2 -e GARMIN_SYNC_ENABLED=false -e APP_SEED_ENABLED=false \
            -e NOTIFICATIONS_MONITOR_ENABLED=false -e REPORTS_SCHEDULER_ENABLED=false -e REPORTS_STORAGE=local \
            astronaut-backend:${{ github.sha }}
          curl --fail --silent --show-error --retry 40 --retry-all-errors --retry-delay 3 --max-time 5 http://127.0.0.1:8080/healthz >/dev/null
      - name: Save tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save astronaut-backend:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: backend-amd64
          path: image.tar.gz
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLAWBOT_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: backend-clawbot
      cancel-in-progress: false
    env:
      CLAWBOT_HOST: ${{ secrets.CLAWBOT_HOST }}
      CLAWBOT_PORT: ${{ secrets.CLAWBOT_PORT }}
      CLAWBOT_USER: ${{ secrets.CLAWBOT_USER }}
      CLAWBOT_SSH_PRIVATE_KEY: ${{ secrets.CLAWBOT_SSH_PRIVATE_KEY }}
      CLAWBOT_KNOWN_HOSTS: ${{ secrets.CLAWBOT_KNOWN_HOSTS }}
      DEPLOY_APP: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-amd64
      - name: Deploy tested image to clawbot over pinned SSH
        run: python3 deploy/ssh_deploy.py
