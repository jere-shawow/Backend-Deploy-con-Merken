name: Merken backend CI/CD via SSM
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests with H2 and fake Garmin
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build ARM64 image
        run: docker build -t astronaut-backend:${{ github.sha }} .
      - name: Smoke test with isolated in-memory database
        run: |
          docker run -d --name merken-ci -p 127.0.0.1:8080:8080 \
            -e 'DB_URL=jdbc:h2:mem:ci;DB_CLOSE_DELAY=-1' -e DB_USER=sa \
            -e DB_PLATFORM=h2 -e GARMIN_SYNC_ENABLED=false -e APP_SEED_ENABLED=false \
            astronaut-backend:${{ github.sha }}
          curl --fail --silent --show-error --retry 40 --retry-all-errors --retry-delay 3 --max-time 5 http://127.0.0.1:8080/healthz >/dev/null
      - name: Save tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save astronaut-backend:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: backend-arm64
          path: image.tar.gz
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EC2_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOY_ARTIFACT_BUCKET: ${{ secrets.DEPLOY_ARTIFACT_BUCKET }}
      SSM_INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
      DEPLOY_APP: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-arm64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: merken-backend-${{ github.run_id }}
      - name: Deploy verified image through SSM
        run: python3 deploy/ssm_deploy.py
